<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estoque · Mercado</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/estoque.css">
  <script src="js/auth.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/app.js"></script>
</head>
<body>
  <header class="mobile-bar">
    <a class="brand" href="painel.html">
      <span class="brand-mark" aria-hidden="true">M</span><span class="brand-name">Mercado</span>
    </a>
    <button type="button" class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="sidebar">Menu</button>
  </header>
  <div class="backdrop" id="backdrop" hidden></div>

  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <div class="page-head">
        <div>
          <h1>Produtos em estoque</h1>
          <p id="resumo">Carregando…</p>
        </div>
        <button type="button" class="btn btn-primary" id="btn-novo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          Novo produto
        </button>
      </div>

      <section class="card table-card">
        <div class="toolbar">
          <label class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <span class="sr-only">Buscar produto</span>
            <input type="search" id="busca" placeholder="Buscar produto ou categoria..." autocomplete="off">
          </label>
          <div class="chips" role="group" aria-label="Filtrar produtos">
            <button type="button" class="chip active" data-filtro="todos">Todos <span id="c-todos"></span></button>
            <button type="button" class="chip" data-filtro="baixo">Estoque baixo <span id="c-baixo"></span></button>
            <button type="button" class="chip" data-filtro="validade">Validade próxima <span id="c-validade"></span></button>
          </div>
        </div>

        <table class="table">
          <thead>
            <tr>
              <th scope="col" class="col-toggle"><span class="sr-only">Detalhes</span></th>
              <th scope="col">Produto</th>
              <th scope="col">Categoria</th>
              <th scope="col" class="num">Qtd</th>
              <th scope="col" class="num">Preço</th>
              <th scope="col" class="actions-col">Ações</th>
            </tr>
          </thead>
          <tbody id="lista"></tbody>
        </table>
        <p class="empty" id="vazio" hidden>Nenhum produto encontrado.</p>

        <p class="legend">
          <span class="dot-low" aria-hidden="true"></span> indica estoque abaixo do mínimo cadastrado
        </p>
      </section>
    </main>
  </div>

  <!-- Cadastro / edição -->
  <dialog class="modal" id="modal-produto" aria-labelledby="modal-titulo">
    <form method="dialog" id="form-produto" novalidate>
      <header class="modal-head">
        <h2 id="modal-titulo">Novo produto</h2>
        <button type="button" class="icon-btn" data-fechar aria-label="Fechar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>

      <div class="modal-body">
        <div class="field full">
          <label for="f-nome">Nome do produto</label>
          <input id="f-nome" required maxlength="80" placeholder="ex: Arroz 5kg">
          <span class="field-error" id="f-nome-error"></span>
        </div>
        <div class="field full">
          <label for="f-categoria">Categoria</label>
          <input id="f-categoria" list="categorias" required maxlength="40" placeholder="ex: Grãos">
          <datalist id="categorias"></datalist>
          <span class="field-error" id="f-categoria-error"></span>
        </div>
        <div class="field">
          <label for="f-qtd">Quantidade</label>
          <input id="f-qtd" type="number" min="0" step="1" inputmode="numeric" required>
          <span class="field-error" id="f-qtd-error"></span>
        </div>
        <div class="field">
          <label for="f-minimo">Estoque mínimo</label>
          <input id="f-minimo" type="number" min="0" step="1" inputmode="numeric" required>
          <span class="field-error" id="f-minimo-error"></span>
        </div>
        <div class="field">
          <label for="f-preco">Preço (R$)</label>
          <input id="f-preco" inputmode="decimal" required placeholder="0,00">
          <span class="field-error" id="f-preco-error"></span>
        </div>
        <div class="field"></div>
        <div class="field">
          <label for="f-compra">Data de compra</label>
          <input id="f-compra" type="date">
          <span class="field-error" id="f-compra-error"></span>
        </div>
        <div class="field">
          <label for="f-validade">Validade</label>
          <input id="f-validade" type="date">
          <span class="field-error" id="f-validade-error"></span>
        </div>
      </div>

      <footer class="modal-foot">
        <button type="button" class="btn btn-ghost" data-fechar>Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btn-salvar">Salvar produto</button>
      </footer>
    </form>
  </dialog>

  <!-- Confirmação de exclusão -->
  <dialog class="modal modal-sm" id="modal-excluir" aria-labelledby="excluir-titulo">
    <div class="modal-body confirm">
      <span class="confirm-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
      </span>
      <h2 id="excluir-titulo">Excluir produto?</h2>
      <p id="excluir-texto"></p>
    </div>
    <footer class="modal-foot">
      <button type="button" class="btn btn-ghost" data-fechar>Cancelar</button>
      <button type="button" class="btn btn-danger" id="btn-confirmar-excluir">Excluir</button>
    </footer>
  </dialog>

  <script src="js/estoque.js"></script>
</body>
</html>
