6844a"/><text x="101.0" y="352.4" font-family="Inter" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Acessar sistema</text><rect x="196" y="324" width="130" height="46" rx="8" fill="#ffffff" stroke="#d9dfdb"/><text x="261.0" y="352.4" font-family="Inter" font-size="15" font-weight="600" fill="#1f6b3a" text-anchor="middle">Saiba mais</text><rect x="16" y="416" width="358" height="330" rx="16" fill="#14281c" fill-opacity="0.06"/><rect x="16" y="400" width="358" height="330" rx="16" fill="#ffffff" stroke="#d9dfdb"/><text x="40" y="440" font-family="Inter" font-size="16" font-weight="700" fill="#1d2420" text-anchor="start">Resumo do dia</text><rect x="40.0" y="460" width="149.0" height="64" rx="10" fill="#f4f6f4"/><text x="54.0" y="482" font-family="Inter" font-size="12" font-weight="400" fill="#5f6b64" text-anchor="start">Vendas hoje</text><text x="54.0" y="510" font-family="Inter" font-size="20" font-weight="700" fill="#1d2420" text-anchor="start">R$ 1.284,50</text><rect x="201.0" y="460" width="149.0" height="64" rx="10" fill="#f4f6f4"/><text x="215.0" y="482" font-family="Inter" font-size="12" font-weight="400" fill="#5f6b64" text-anchor="start">Ticket médio</text><text x="215.0" y="510" font-family="Inter" font-size="20" font-weight="700" fill="#1d2420" text-anchor="start">R$ 40,10</text><rect x="40" y="540" width="310" height="38" rx="8" fill="#fff6e0"/><text x="52" y="564" font-family="Inter" font-size="13" font-weight="400" fill="#8a5a00" text-anchor="start">Leite integral 1L com estoque baixo (4 un.)</text><rect x="40" y="590" width="310" height="1" rx="0" fill="#d9dfdb"/><text x="42" y="618" font-family="Inter" font-size="14" font-weight="400" fill="#1d2420" text-anchor="start">Arroz 5kg</text><text x="348" y="618" font-family="Inter" font-size="14" font-weight="400" fill="#5f6b64" text-anchor="end">42 un.</text><rect x="40" y="632" width="310" height="1" rx="0" fill="#d9dfdb"/><text x="42" y="660" font-family="Inter" font-size="14" font-weight="400" fill="#1d2420" text-anchor="start">Feijão 1kg</text><text x="348" y="660" font-family="Inter" font-size="14" font-weight="400" fill="#5f6b64" text-anchor="end">8 un.</text><rect x="40" y="674" width="310" height="1" rx="0" fill="#d9dfdb"/><text x="42" y="702" font-family="Inter" font-size="14" font-weight="400" fill="#1d2420" text-anchor="start">Óleo de soja</text><text x="348" y="702" font-family="Inter" font-size="14" font-weight="400" fill="#5f6b64" text-anchor="end">30 un.</text><rect x="0" y="788" width="390" height="780" rx="0" fill="#ffffff"/><rect x="0" y="788" width="390" height="1" rx="0" fill="#d9dfdb"/><rect x="0" y="1567" width="390" height="1" rx="0" fill="#d9dfdb"/><text x="16" y="870" font-family="Inter" font-size="24" font-weight="700" fill="#1d2420" text-anchor="start">Tudo o que a operação precisa</text><text x="16" y="902" font-family="Inter" font-size="15" font-weight="400" fill="#5f6b64" text-anchor="start">Cada módulo resolve uma parte do dia a dia,</text><text x="16" y="926" font-family="Inter" font-size="15" font-weight="400" fill="#5f6b64" text-anchor="start">e todos compartilham a mesma base de dados.</text><rect x="16" y="962" width="358" height="170" rx="12" fill="#f4f6f4" stroke="#d9dfdb"/><rect x="40" y="990" width="48" height="48" rx="10" fill="#eaf5ee"/><g transform="translate(52 1002) scale(1.0)" fill="none" stroke="#1f6b3a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4v10l-9 4-9-4V7z"/><path d="M3 7l9 4 9-4M12 11v10"/></g><text x="40" y="1074" font-family="Inter" font-size="18" font-weight="700" fill="#1d2420" text-anchor="start">Estoque sempre atualizado</text><text x="40" y="1100" font-family="Inter" font-size="15" font-weight="400" fill="#5f6b64" text-anchor="start">Controle de produtos, validade</text><text x="40" y="1122" font-family="Inter" font-size="15" font-weight="400" fill="#5f6b64" text-anchor="start">e alerta de estoque baixo.</text><rect x="16" y="1152" width="358" height="170" rx="12" fill="#f4f6f4" stroke="#d9dfdb"/><rect x="40" y="1180" width="48" height="48" rx="10" fill="#eaf5ee"/><g transform="translate(52 1192) scale(1.0)" fill="none" stroke="#1f6b3a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6h13v10H1zM14 10h4l3 3v3h-7z"/><circle cx="5" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></g><text x="40" y="1264" font-family="Inter" font-size="18" font-weight="700" fill="#1d2420" text-anchor="start">Fornecedores organizados</text><text x="40" y="1290" font-family="Inter" font-size="15" font-weight="400" fill="#5f6b64" text-anchor="start">Cadastro e pedidos de</text><text x="40" y="1312" font-family="Inter" font-size="15" font-weight="400" fill="#5f6b64" text-anchor="start">reposição em um só lugar.</text><rect x="16" y="1342" width="358" height="170" rx="12" fill="#f4f6f4" stroke="#d9dfdb"/><rect x="40" y="1370" width="48" height="48" rx="10" fill="#eaf5ee"/><g transform="translate(52 1382) scale(1.0)" fill="none" stroke="#1f6b3a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h4M14 13h3M7 16h4M14 16h3"/></g><text x="40" y="1454" font-family="Inter" font-size="18" font-weight="700" fill="#1d2420" text-anchor="start">Caixa rápido e simples</text><text x="40" y="1480" font-family="Inter" font-size="15" font-weight="400" fill="#5f6b64" text-anchor="start">Venda, pagamento e</text><text x="40" y="1502" font-family="Inter" font-size="15" font-weight="400" fill="#5f6b64" text-anchor="start">comprovante em poucos cliques.</text><text x="16" y="1650" font-family="Inter" font-size="26" font-weight="700" fill="#1d2420" text-anchor="start">Fale com a gente</text><text x="16" y="1682" font-family="Inter" font-size="15" font-weight="400" fill="#5f6b64" text-anchor="start">Tem alguma dúvida ou quer usar o sistema</text><text x="16" y="1706" font-family="Inter" font-size="15" font-weight="400" fill="#5f6b64" text-a