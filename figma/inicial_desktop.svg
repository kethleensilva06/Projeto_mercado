s, validade</text><text x="184" y="904" font-family="Inter" font-size="15" font-weight="400" fill="#5f6b64" text-anchor="start">e alerta de estoque baixo.</text><rect x="540" y="744" width="360" height="186" rx="12" fill="#f4f6f4" stroke="#d9dfdb"/><rect x="564" y="772" width="48" height="48" rx="10" fill="#eaf5ee"/><g transform="translate(576 784) scale(1.0)" fill="none" stroke="#1f6b3a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6h13v10H1zM14 10h4l3 3v3h-7z"/><circle cx="5" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></g><text x="564" y="856" font-family="Inter" font-size="18" font-weight="700" fill="#1d2420" text-anchor="start">Fornecedores organizados</text><text x="564" y="882" font-family="Inter" font-size="15" font-weight="400" fill="#5f6b64" text-anchor="start">Cadastro e pedidos de</text><text x="564" y="904" font-family="Inter" font-size="15" font-weight="400" fill="#5f6b64" text-anchor="start">reposição em um só lugar.</text><rect x="920" y="744" width="360" height="186" rx="12" fill="#f4f6f4" stroke="#d9dfdb"/><rect x="944" y="772" width="48" height="48" rx="10" fill="#eaf5ee"/><g transform="translate(956 784) scale(1.0)" fill="none" stroke="#1f6b3a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h4M14 13h3M7 16h4M14 16h3"/></g><text x="944" y="856" font-family="Inter" font-size="18" font-weight="700" fill="#1d2420" text-anchor="start">Caixa rápido e simples</text><text x="944" y="882" font-family="Inter" font-size="15" font-weight="400" fill="#5f6b64" text-anchor="start">Venda, pagamento e</text><text x="944" y="904" font-family="Inter" font-size="15" font-weight="400" fill="#5f6b64" text-anchor="start">comprovante em poucos cliques.</text><text x="160" y="1122" font-family="Inter" font-size="32" font-weight="700" fill="#1d2420" text-anchor="start">Fale com a gente</text><text x="160" y="1154" font-family="Inter" font-size="16" f